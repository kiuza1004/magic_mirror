<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#0a0a0f" />
    <title>Magic Mirror — 만화경</title>
    <style>
      html, body { margin: 0; height: 100%; background: #05050a; color: #f4f4f7; font-family: -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif; }
      #root { height: 100%; }
      #boot { position: fixed; inset: 0; display: grid; place-items: center; color: rgba(255,255,255,.55); letter-spacing: .3em; font-size: 12px; }
      #err { position: fixed; inset: 0; padding: 24px; overflow: auto; background: #15050a; color: #ffb4b4; font: 12px ui-monospace, monospace; white-space: pre-wrap; display: none; z-index: 9999; }
    </style>
  </head>
  <body>
    <div id="root"><div id="boot">LOADING MAGIC MIRROR…</div></div>
    <pre id="err"></pre>
    <script>
      (function () {
        var box = document.getElementById('err');
        var booted = false;
        function show(msg) { if (!box) return; box.style.display = 'block'; box.textContent = (box.textContent ? box.textContent + '\n\n' : '') + msg; }
        window.__mmShow = show;
        window.__mmBooted = function () { booted = true; };
        window.addEventListener('error', function (e) {
          show('window error\n' + (e.message || (e.error && e.error.message) || e) + '\n' + (e.filename || '') + ':' + (e.lineno || '') + ':' + (e.colno || ''));
        }, true);
        window.addEventListener('unhandledrejection', function (e) { show('promise rejection\n' + (e.reason && e.reason.stack ? e.reason.stack : e.reason)); });
        var ua = navigator.userAgent;
        setTimeout(function () {
          if (booted) return;
          show('TIMEOUT — 모듈 스크립트가 실행되지 않았습니다.\nUA: ' + ua + '\nlocation: ' + location.href + '\nDocument readyState: ' + document.readyState + '\nES module 지원 또는 네트워크/광고차단 확인 필요');
        }, 4000);
      })();
    </script>
    <script type="module" src="/src/main.tsx" onerror="window.__mmShow && window.__mmShow('module script load failed (onerror): ' + this.src)"></script>
  </body>
</html>
